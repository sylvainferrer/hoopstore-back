# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  app.url: "%env(APP_URL)%"
  stripe.public_key: "%env(STRIPE_PUBLIC_KEY)%"
  stripe.secret_key: "%env(STRIPE_SECRET_KEY)%"
  stripe.webhook_secret: "%env(STRIPE_WEBHOOK_SECRET)%"
  uploads_directory: "%kernel.project_dir%/public/uploads/images/"

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  App\Service\StripeService:
    arguments:
      $secretKey: "%stripe.secret_key%"
      $publicKey: "%stripe.public_key%"

  acme_api.event.authentication_failure_listener:
    class: App\EventListener\AuthenticationFailureListener
    tags:
      - {
          name: kernel.event_listener,
          event: lexik_jwt_authentication.on_authentication_failure,
          method: onAuthenticationFailureResponse,
        }

  App\EventListener\JWTFailureListener:
    tags:
      - {
          name: kernel.event_listener,
          event: lexik_jwt_authentication.on_jwt_invalid,
          method: onJwtFailure,
        }
      - {
          name: kernel.event_listener,
          event: lexik_jwt_authentication.on_jwt_not_found,
          method: onJwtFailure,
        }
      - {
          name: kernel.event_listener,
          event: lexik_jwt_authentication.on_jwt_expired,
          method: onJwtFailure,
        }

  acme_api.event.authentication_success_listener:
    class: App\EventListener\AuthenticationSuccessListener
    tags:
      - {
          name: kernel.event_listener,
          event: lexik_jwt_authentication.on_authentication_success,
          method: onAuthenticationSuccessResponse,
        }

  App\EventListener\ApiLogoutListener:
    tags:
      - {
          name: kernel.event_listener,
          event: 'Symfony\Component\Security\Http\Event\LogoutEvent',
          method: onLogout,
          dispatcher: "security.event_dispatcher.api",
        }

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
