lexik_jwt_authentication:
  secret_key: "%env(resolve:JWT_SECRET_KEY)%"
  public_key: "%env(resolve:JWT_PUBLIC_KEY)%"
  pass_phrase: "%env(JWT_PASSPHRASE)%"
  token_ttl: 3600

  # token encoding/decoding settings
  encoder:
    # token encoder/decoder service - default implementation based on the lcobucci/jwt library
    service: lexik_jwt_authentication.encoder.lcobucci

    # encryption algorithm used by the encoder service
    signature_algorithm: RS256

  # token extraction settings
  token_extractors:
    # look for a token as Authorization Header
    authorization_header:
      enabled: false
      prefix: Bearer
      name: Authorization

    cookie:
      enabled: true
      name: BEARER

    # check token in query string parameter
    query_parameter:
      enabled: false
      name: bearer

    # check token in a cookie
    split_cookie:
      enabled: false
      cookies:
        - jwt_hp
        - jwt_s

  set_cookies: # !!!!! SI MODIFICATIONS DE 'set_cookies' : METTRE À JOUR LA ROUTE '/api/admin/users/me' method:DELETE
    BEARER:
      lifetime: null #(defaults to token ttl)
      samesite: lax
      path: /
      domain: null #(null means automatically set by symfony)
      secure: false #(default to true)
      httpOnly: false
      partitioned: false

  # remove the token from the response body when using cookies
  remove_token_from_body_when_cookies_used: true

  # invalidate the token on logout by storing it in the cache
  blocklist_token:
    enabled: true
    cache: cache.app
